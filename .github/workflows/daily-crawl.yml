name: Daily Twitter Crawl

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  START_DATE: "2019-12-01"
  END_DATE: "2020-01-30"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Decide which date to crawl next
      - name: Decide crawl date
        run: |
          mkdir -p data

          echo "Start date: $START_DATE"
          echo "End date: $END_DATE"

          if ls data/*.csv >/dev/null 2>&1; then
            last=$(ls data/*.csv | sed 's#.*/##' | sed 's/.csv//' | sort | tail -n 1)
            next=$(date -u -d "$last +1 day" +"%Y-%m-%d")
            echo "Last crawled: $last"
          else
            next="$START_DATE"
            echo "No data found, starting from START_DATE"
          fi

          echo "Next crawl date: $next"

          # Stop if beyond end date
          if [[ "$next" > "$END_DATE" ]]; then
            echo "Reached end of crawl range ($END_DATE). Nothing to do."
            echo "SKIP_CRAWL=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "CRAWL_DATE=$next" >> $GITHUB_ENV
          echo "Using crawl date: $next"

      - name: Run crawler
        if: env.SKIP_CRAWL != 'true'
        env:
          TWITTER_TOKEN: ${{ secrets.TWITTER_TOKEN }}
          CRAWL_DATE: ${{ env.CRAWL_DATE }}
        run: |
          chmod +x scripts/crawl_day.sh
          ./scripts/crawl_day.sh

      - name: Commit crawl result
        if: env.SKIP_CRAWL != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/*.csv
          git commit -m "Add crawl result for $CRAWL_DATE" || echo "Nothing to commit"
          git push
