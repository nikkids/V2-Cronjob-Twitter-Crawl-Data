name: Daily Twitter Crawl
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  START_DATE: "2018-12-01"
  END_DATE: "2019-01-30"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide crawl date
        run: |
          mkdir -p data
          echo "Start date: $START_DATE"
          echo "End date: $END_DATE"

          files=$(ls data/*.csv 2>/dev/null | sed 's#.*/##' | sed 's/.csv//' | sort)
          valid_files=""
          for f in $files; do
            if [[ ( "$f" > "$START_DATE" || "$f" == "$START_DATE" ) && \
                  ( "$f" < "$END_DATE"   || "$f" == "$END_DATE"   ) ]]; then
              valid_files="$valid_files $f"
            fi
          done

          if [[ -n "$valid_files" ]]; then
            last=$(echo $valid_files | tr ' ' '\n' | sort | tail -n 1)
            next=$(date -u -d "$last +1 day" +"%Y-%m-%d")
            echo "Last valid crawled: $last"
          else
            next="$START_DATE"
            echo "No valid data in range, starting from START_DATE"
          fi

          echo "Next crawl date: $next"

          if [[ "$next" > "$END_DATE" ]]; then
            echo "Reached end of crawl range ($END_DATE). Nothing to do."
            echo "SKIP_CRAWL=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "CRAWL_DATE=$next" >> $GITHUB_ENV
          echo "Using crawl date: $next"

      - name: Run crawler
        if: env.SKIP_CRAWL != 'true'
        env:
          TWITTER_TOKEN: ${{ secrets.TWITTER_TOKEN }}
          CRAWL_DATE: ${{ env.CRAWL_DATE }}
        run: |
          chmod +x scripts/crawl_day.sh
          ./scripts/crawl_day.sh

      - name: Commit crawl result
        if: env.SKIP_CRAWL != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git commit -m "Add crawl result for $CRAWL_DATE" || echo "Nothing to commit"
          git push
