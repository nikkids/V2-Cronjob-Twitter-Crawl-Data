name: Daily Twitter Crawl

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Decide crawl date
        run: |
          mkdir -p data
          echo "CRAWL_DATE=2019-04-22" >> $GITHUB_ENV
          echo "Using crawl date: 2019-04-22"

      - name: Run crawler
        env:
          TWITTER_TOKEN: ${{ secrets.TWITTER_TOKEN }}
        run: |
          chmod +x scripts/crawl_day.sh
          ./scripts/crawl_day.sh

      - name: Commit crawl result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -n "$(git status --porcelain data)" ]; then
            git add data
            git commit -m "Add crawl result for $CRAWL_DATE"
            git push
          else
            echo "No new data to commit"
          fi
