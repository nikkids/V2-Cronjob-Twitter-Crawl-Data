name: Daily Twitter Crawl

on:
  schedule:
    # 19:00 WIB = 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run crawler
        env:
          TWITTER_TOKEN: ${{ secrets.TWITTER_TOKEN }}
        run: |
          chmod +x scripts/crawl_day.sh
          ./scripts/crawl_day.sh

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data .cursor_date

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily crawl $(date -u +%Y-%m-%d)"
            git push
          fi

